<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BraCovoit — Détail du trajet</title>
  <link rel="stylesheet" href="trajet.css">
</head>
<body id="page-trajet">

  <!-- NAVIGATION -->
  <nav class="sidebar">
    <p class="sidebar-titre">BraCovoit</p>
    <a href="../accueil/index.html">Accueil</a>
    <a href="../recherche/recherche.html">Rechercher</a>
    <a href="trajet.html" class="active">Détail trajet</a>
    <a href="../proposer/proposer.html">Proposer un trajet</a>
    <a href="../mes-trajets/mes-trajets.html">Mes trajets</a>
    <a href="../dashboard/dashboard.html">Dashboard conducteur</a>
    <a href="../confirmation/confirmation.html">Confirmation</a>

    <!-- NE PAS MODIFIER l'id — main.js y affiche l'état de connexion -->
    <div id="nav-session"></div>
  </nav>

  <main>
    <!-- =====================================================================
         ENTÊTE TRAJET
         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="entete-trajet card">
      <div class="entete-header">
        <h1 id="trajet-titre">Détail du trajet</h1>
        <span id="badge-places" class="badge"></span>
      </div>

      <p class="meta">
        <span class="meta-item">Heure : <span id="trajet-heure"></span></span>
        <span class="meta-item">Date : <span id="trajet-date"></span></span>
        <span class="meta-item">Prix : <span id="trajet-prix"></span></span>
      </p>

      <p class="quote">Commentaire : <span id="trajet-commentaire"></span></p>
    </section>

    <!-- =====================================================================
         FICHE CONDUCTEUR
         *** NE PAS MODIFIER les id ci-dessous ***
         ===================================================================== -->
    <section class="fiche-conducteur card">
      <h2>Conducteur</h2>
      <div class="profil">
        <div class="avatar" aria-hidden="true"></div>
        <div class="profil-infos">
          <p class="profil-nom">Nom : <span id="conducteur-nom"></span></p>
          <p>Véhicule : <span id="conducteur-vehicule"></span></p>
          <p>Note : <span id="conducteur-note"></span></p>
          <p>Expérience : <span id="conducteur-trajets"></span></p>
        </div>
      </div>
    </section>

    <!-- =====================================================================
         FORMULAIRE DE RÉSERVATION
         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <form id="form-reservation" class="card">
      <h3>Réserver une place</h3>

      <label for="r-nom">Votre nom</label>
      <input type="text" id="r-nom">

      <label for="r-tel">Votre téléphone</label>
      <input type="tel" id="r-tel">

      <button type="submit" id="btn-reserver">Réserver une place</button>
    </form>

    <!-- Zone d'erreurs de validation — NE PAS MODIFIER l'id.
         main.js y injecte un <ul><li>...</li></ul> -->
    <div id="erreurs-form" class="erreurs-form" hidden></div>
  </main>

  <div id="erreur-globale" class="erreur-globale" hidden></div>

  <script src="../functions.js"></script>
  <script src="../main.js"></script>
</body>
</html>
