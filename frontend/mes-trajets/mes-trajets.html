      <!-- =====================================================================
         RECHERCHE PAR NUMÉRO — TODO (Dev FS5)
         Mettre en forme le bloc de saisie du numéro de téléphone, le
         bouton de chargement et le filtre de statut. Layout en ligne sur
         desktop, empilé sur mobile.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***

      <section class="barre-recherche-tel">
        <h2>Rechercher mes réservations</h2>

        <input
          type="text"
          id="mt-tel"
          placeholder="Votre numéro de téléphone"
        />

        <button id="btn-charger-mestrajets">Voir mes trajets</button>

        <select id="mt-filtre-statut">
          <option value="">Tous les statuts</option>

          <option value="effectue">Effectués</option>

          <option value="en_attente">En attente</option>

          <option value="annule">Annulés</option>
        </select>

      <!-- TOTAL DÉPENSÉ — TODO (Dev FS5) : mettre en avant ce chiffre

      <section class="bloc-total">
        <h2>Total dépensé</h2>

        <p class="total-depense">
          Total dépensé :
          <strong id="mt-total"></strong>
        </p>
      </section>

      <!-- =====================================================================
         LISTE DES RÉSERVATIONS — TODO (Dev FS5)

         ou grille selon votre choix.

         *** NE PAS MODIFIER l'id ***
         ===================================================================== -->

      <section class="reservations">
